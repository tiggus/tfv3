Description:  |
  Enable EBS Default Encryption
Resources:
  EnableEbsEncryptionFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.9
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def lambda_handler(event, context):
              ec2 = boto3.client('ec2')
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      ec2.enable_ebs_encryption_by_default()
                  elif event['RequestType'] == 'Delete':
                      ec2.disable_ebs_encryption_by_default()
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, "EnableEbsEncryption")
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Message": str(e)}, "EnableEbsEncryption")

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EnableEbsEncryption
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:EnableEbsEncryptionByDefault
                  - ec2:DisableEbsEncryptionByDefault
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  EnableEbsEncryptionCustomResource:
    Type: Custom::EnableEbsEncryption
    Properties:
      ServiceToken: !GetAtt EnableEbsEncryptionFunction.Arn

  LambdaDurationAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
        AlarmName: !Sub "awslambda-lambdadurationalarm"
        ActionsEnabled: true
        # AlarmActions: 
          # - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentPrefix}-devops-alerts"
        MetricName: "Duration"
        Namespace: "AWS/Lambda"
        Statistic: "Average"
        Dimensions: 
          - 
            Name: "FunctionName"
            Value: !Ref EnableEbsEncryptionFunction
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1000
        ComparisonOperator: "GreaterThanThreshold"
        
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "awslambda-lambdaerroralarm"
      AlarmDescription: Alarm if Lambda errors > 0 in 5 minutes
      ActionsEnabled: true
      # AlarmActions: 
          # - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentPrefix}-devops-alerts"      
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EnableEbsEncryptionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: "GreaterThanThreshold"      